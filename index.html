<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnEmotioneD</title>
    <link rel="icon" type="image/svg+xml" href="./public/img/favicon.svg" />
    <!-- starts font download before CSS is parsed -->
    <link
      rel="preload"
      href="./public/fonts/IosevkaNerdFontMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./public/fonts/IosevkaNerdFontMono-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./index.css" />
    <script src="./public/js/jquery-4.0.0.min.js"></script>
    <script src="./index.js"></script>
  </head>
  <body>
    <header>
      <div class="header-wrapper">
        <div>
          <img
            src="public/img/favicon.svg"
            alt="unemotioned_logo"
            height="80rem"
          />
        </div>

        <div>
          <h1>UnEmotioneD</h1>
        </div>
      </div>
    </header>

    <main>
      <h1>I Use Arch by the way</h1>

      <article>
        <p>
          Using
          <!-- open in new tab w/ `target` attribute -->
          <a href="https://github.com/folke/tokyonight.nvim" target="_blank"
            >Tokyo Night Storm</a
          >
          colors by folke.
        </p>

        <p>
          Font is
          <a href="https://typeof.net/Iosevka/" target="_blank">Iosevka</a>
          since
          <a href="https://www.jetbrains.com/lp/mono/" target="_blank"
            >JetBrains Mono</a
          >
          is popular.
        </p>

        <hr />

        <h2>Balance Flattener</h2>

        <p>
          Calculates how much points to use to make the bank account digits nice
          and flat.
        </p>

        <form id="flattenerForm">
          <table>
            <tbody>
              <tr>
                <td><label for="balance">balance</label></td>
                <td><input type="text" id="balance" /></td>
              </tr>
              <tr>
                <td><label for="price">price</label></td>
                <td><input type="text" id="price" /></td>
              </tr>
              <tr>
                <td><label for="points">points</label></td>
                <td><input type="text" id="points" /></td>
              </tr>
            </tbody>
          </table>

          <input type="submit" value="Submit" />
        </form>

        <div id="showPoints"></div>
      </article>
    </main>
  </body>
</html>
