<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnEmotioneD</title>
    <link rel="icon" type="image/svg+xml" href="./public/img/favicon.svg" />
    <!-- starts font download before CSS is parsed -->
    <link
      rel="preload"
      href="./public/fonts/IosevkaNerdFontMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./public/fonts/IosevkaNerdFontMono-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./index.css" />
    <script src="./public/js/jquery-4.0.0.min.js"></script>
    <script src="./index.js"></script>
  </head>
  <body>
    <header>
      <div class="inner-header">
        <img src="./public/img/favicon.svg" alt="logo" class="logo" />
        <h1 class="title">Balance Flattener</h1>
      </div>
    </header>
    <main>
      <section class="flattener-section">
        <p>
          Calculates how much points to use to make the bank account digit nice
          and flat.
        </p>
        <form class="flattener-form">
          <table>
            <tbody>
              <tr>
                <td><label for="balance">Balance</label></td>
                <td><input type="text" id="balance" /></td>
              </tr>
              <tr>
                <td><label for="price">Price</label></td>
                <td><input type="text" id="price" /></td>
              </tr>
              <tr>
                <td><label for="points">Points</label></td>
                <td><input type="text" id="points" /></td>
              </tr>
            </tbody>
          </table>
          <input type="submit" value="Submit" />
        </form>
        <div class="flattener-results"></div>
      </section>
    </main>
  </body>
</html>
